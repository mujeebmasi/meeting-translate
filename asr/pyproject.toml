[project]
name = "meet-translate-asr"
version = "0.1.0"
description = "Local speech-to-text for Hindi/Telugu/Tamil/Kannada (AI4Bharat IndicConformer), called by the NestJS backend"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "transformers>=4.44,<5",
  "onnxruntime==1.20.1",
  "onnx==1.20.1",
  "huggingface_hub>=0.24",
  "python-dotenv>=1.0",
]

[tool.uv]
package = false

# CPU-only PyTorch: ~200 MB instead of ~2.5 GB. The model itself runs in
# ONNX Runtime; torch is only used for turning audio into features.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
